[package]
name = "rusm64"
version = "0.2.0"
edition = "2024"
description = "MOS/Commodore C64 assembler."
authors = [ "Jens Korinth <jens.korinth@tuta.io>" ]
repository = "https://github/jkorinth/rusm64.git"
license = "GPL-2.0-or-later"
keywords = [ "assembler", "6502", "6510", "C64", "Commodore" ]

[dev-dependencies]
itertools = "0.14.0"
proptest = "1.4"
regex = "1.11.1"

[dependencies]
pest = { version = "2.7" }
pest_derive = "2.7"
thiserror = "1.0"
log = "0.4"
clap = { version = "4.4", features = ["derive"] }
once_cell = "1.18"
derive_more = { version = "2.0.1", features = ["full"] }
rhai = "1.21.0"
rusm64-macros = { path = "./rusm64-macros" }

[lib]
name = "rusm"
path = "src/lib.rs"

[[bin]]
name = "rusm64"
path = "src/main.rs"
